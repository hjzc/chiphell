# 应用图标配置-https://pub.dev/packages/flutter_launcher_icons 
# 安装 flutter pub add --dev flutter_launcher_icons
# 生成图标命令 flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  # 为 Android 配置图标
  android: true
  # 为 iOS 配置图标
  ios: true
  # 指定图标图片路径 512x512, 不透明
  image_path: "assets/images/appicon.png"
  macos:
    generate: true
    #图片路径512x512 可以透明
    image_path: "assets/images/appicon_mac.png"

# 启动图配置 https://pub-web.flutter-io.cn/packages/flutter_native_splash
# 安装 flutter pub add --dev flutter_native_splash
# 创建启动图片 flutter pub run flutter_native_splash:create
flutter_native_splash:
  # 为 Android 设置启动图
  # android: "launcher_icon" # 自定义 icon 名称
  android: true
  # 为 iOS 设置启动图
  ios: true
  # 设置启动图的背景图片（二选一）
  #background_image: "assets/images/splash_bg.png"

  # 设置启动图的背景颜色（二选一）
  color: "#ffffff"
  # 设置启动图的图片（1242x2436）路径，使用背景颜色推荐加上这个
  image: assets/images/splash.png
  color_dark: "#121212"
  image_dark: assets/images/splash.png


  # 配置 Android 12 及以上版本的启动图，只会显示中间一个圆圈
  android_12:
    # 设置启动图的图片路径，圆圈内的图片（512x512）
    image: assets/images/splash12.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/splash12.png
    icon_background_color_dark: "#121212"

    # 圆圈内图片的背景颜色
    # icon_background_color: "#FFFFFF"
    # 设置启动图的背景颜色，圆圈外的使用背景颜色
    #color: "#FFFFFF"
