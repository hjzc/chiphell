name: Chiphell
version: 1.0.11
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-chiphell: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.chiphell # adjust accordingly to your app name

apps:
  chiphell:
    command: chiphell
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-chiphell
parts:
  chiphell:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
