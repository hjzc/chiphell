output: dist/
variables:
  # FLUTTER_ROOT: ~/fvm/versions/3.16.5
  # PGYER_API_KEY: your api key
releases:
  - name: dev-profile
    jobs:
      - name: linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            profile: true
      - name: linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            profile: true
      - name: linux-zip
        package:
          platform: linux
          target: zip
          build_args:
            profile: true
  - name: dev-release
    jobs:
      - name: linux-appimage
        package:
          platform: linux
          target: appimage
      - name: linux-deb
        package:
          platform: linux
          target: deb
          # build_args:
          #   depends:
          #     - libsoup-3.0
      - name: linux-zip
        package:
          platform: linux
          target: zip